# The [aiidalab] section is what the aiidalab package installed in the
# AiiDAlab images actually reads for the home-page app tile (it ignores
# metadata.json, which newer registry tooling uses) — keep the two in sync.
# The logo path is relative to the home app's URL (/apps/apps/home/), hence
# the ../<app-dir>/ prefix; it survives JupyterHub base-url prefixes.
[aiidalab]
title = Quadrupolar NMR Simulator
description = Interactive first/second-order quadrupolar NMR/NQR spectrum simulator
    (powder and single crystal) from user-entered Cq (or nu_Q), eta, isotope and
    magnetic field. Part of aiida-qe-converse, which also provides aiidalab-qe
    plugins for computing NMR shielding and EFG tensors with QE-CONVERSE.
authors = aiida-qe-converse developers
logo = ../quadrupolar-simulator/misc/logo.svg
state = development
categories =
    quantum
    utilities
