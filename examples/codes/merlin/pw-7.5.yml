# Quantum ESPRESSO 7.5 pw.x on the Merlin7 CPU partition.
#
# Install (the `merlin7-cpu` computer must already exist -- see README.md):
#   verdi code create core.code.installed --non-interactive --config pw-7.5.yml
#
# Paths and modules are specific to this build; edit for your account if needed.
label: pw-7.5
description: Quantum ESPRESSO 7.5 pw.x (module qe/7.5) on merlin7-cpu
computer: merlin7-cpu
filepath_executable: /data/user/gubler_m/src/q-e-7.5-configure/bin/pw.x
default_calc_job_plugin: quantumespresso.pw
use_double_quotes: false
with_mpi: true
prepend_text: |
  module use /data/user/gubler_m/modulefiles/
  module load qe/7.5
append_text: ''
