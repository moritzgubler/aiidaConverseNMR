services:
  aiidalab:
    build:
      # Build context is the repo root so the Dockerfile can COPY the plugin
      # (the root .dockerignore applies); the Dockerfile itself lives in docker/.
      context: ..
      dockerfile: docker/Dockerfile
    image: aiida-qe-converse:local
    ports:
      - "8888:8888"
    environment:
      SETUP_DEFAULT_AIIDA_PROFILE: 'true'
    volumes:
      - aiida-qe-converse-home:/home/jovyan

volumes:
  aiida-qe-converse-home:
